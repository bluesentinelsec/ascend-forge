# Generated by cppboot (--with-web-ci)
# Web/Emscripten: build the wasm32 static library, the HTML5 canvas demo, and
# the browser test page; run the tests in headless Chrome via emrun; package
# the installed library with the demo bundled.
name: Web

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Emscripten/browser)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure Debug
        run: >
          emcmake cmake -S . -B build/web-debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DASCEND_FORGE_BUILD_TESTS=ON
          -DASCEND_FORGE_BUILD_PRIMITIVES=ON

      - name: Build Debug
        run: cmake --build build/web-debug --parallel

      - name: Test Debug in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_web_test.html

      - name: Test Debug arena checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_arena_test.html

      - name: Test Debug utf8 checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_utf8_test.html

      - name: Test Debug result checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_result_test.html

      - name: Test Debug io checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_io_test.html

      - name: Test Debug json checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_json_test.html

      - name: Test Debug slice checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_slice_test.html

      - name: Test Debug atomic checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_atomic_test.html

      - name: Test Debug thread checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_thread_test.html

      - name: Test Debug time checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_time_test.html

      - name: Test Debug index checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-debug/bin/ascend_forge_index_test.html

      - name: Configure Release
        run: >
          emcmake cmake -S . -B build/web-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DASCEND_FORGE_BUILD_TESTS=ON
          -DASCEND_FORGE_BUILD_PRIMITIVES=ON

      - name: Build Release
        run: cmake --build build/web-release --parallel

      - name: Test Release in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_web_test.html

      - name: Test Release arena checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_arena_test.html

      - name: Test Release utf8 checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_utf8_test.html

      - name: Test Release result checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_result_test.html

      - name: Test Release io checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_io_test.html

      - name: Test Release json checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_json_test.html

      - name: Test Release slice checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_slice_test.html

      - name: Test Release atomic checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_atomic_test.html

      - name: Test Release thread checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_thread_test.html

      - name: Test Release time checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_time_test.html

      - name: Test Release index checks in headless Chrome
        run: >
          emrun --browser=google-chrome
          --browser_args="--headless=new --no-sandbox --disable-gpu"
          --kill_exit --timeout 120
          build/web-release/bin/ascend_forge_index_test.html

      - name: Verify canvas demo build
        run: |
          set -euo pipefail
          test -f build/web-release/bin/ascend-forge.html
          test -f build/web-release/bin/ascend-forge.js
          test -f build/web-release/bin/ascend-forge.wasm
          # emcc -O3 minifies the shell (strips attribute quotes); match the tag.
          grep -qi "<canvas" build/web-release/bin/ascend-forge.html

      - name: Package web library and demo
        id: package
        run: |
          set -euo pipefail
          stem="ascend-forge-web-wasm32-release-$(tr -d "[:space:]" < VERSION | sed "s/^v//;s/^V//;s/#.*//")"
          prefix="${PWD}/dist/${stem}"
          cmake --install build/web-release --prefix "${prefix}"
          emcc --version | sed -n '1p' > "${prefix}/EMSCRIPTEN_VERSION"
          cp LICENSE "${prefix}/LICENSE"
          mkdir -p "${prefix}/demo"
          cp build/web-release/bin/ascend-forge.html build/web-release/bin/ascend-forge.js \
             build/web-release/bin/ascend-forge.wasm "${prefix}/demo/"
          (cd dist && zip -r "${stem}.zip" "${stem}" >/dev/null)
          echo "artifact_name=${stem}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=dist/${stem}.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload web package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
