plugins {
    id "com.android.library"
}

def repositoryRoot = rootProject.projectDir.parentFile
def moduleBuildDir = file(buildDir)
def prefabHeaders = file("${moduleBuildDir}/generated/prefab-headers")
def packageVersion = new File(repositoryRoot, "VERSION").readLines()[0]
        .replaceFirst(/^[vV]/, "")
        .replaceFirst(/[ \t]*#.*$/, "")
        .trim()

version = packageVersion

android {
    namespace "com.example.ascendforge"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        minSdk 21

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DASCEND_FORGE_BUILD_APP=OFF",
                          "-DASCEND_FORGE_BUILD_TESTS=OFF",
                          "-DASCEND_FORGE_BUILD_BENCHMARKS=OFF",
                          "-DASCEND_FORGE_BUILD_PRIMITIVES=ON",
                          "-DASCEND_FORGE_WITH_CLI11=OFF",
                          "-DASCEND_FORGE_WITH_JSON=OFF",
                          "-DASCEND_FORGE_WITH_SPDLOG=OFF"
                targets "ascend_forge"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        prefabPublishing true
    }

    prefab {
        ascend_forge {
            headers prefabHeaders.absolutePath
        }
    }

    externalNativeBuild {
        cmake {
            path repositoryRoot.toPath().resolve("CMakeLists.txt").toFile()
            version "3.22.1"
        }
    }
}

// Prefab ships a header snapshot with the AAR: the public include/ tree plus a
// rendered version.hpp (Gradle-side equivalent of the CMake configure_file).
tasks.register("preparePrefabHeaders") {
    inputs.dir(new File(repositoryRoot, "include"))
    inputs.file(new File(repositoryRoot, "VERSION"))
    inputs.file(new File(repositoryRoot, "cmake/version.hpp.in"))
    outputs.dir(prefabHeaders)

    doLast {
        delete(prefabHeaders)
        copy {
            from new File(repositoryRoot, "include")
            into prefabHeaders
            include "**/*.h", "**/*.hpp"
        }

        def components = packageVersion.tokenize(".-")
        if (components.size() < 3 || !components.take(3).every { it ==~ /[0-9]+/ }) {
            throw new GradleException("VERSION must begin with numeric major.minor.patch")
        }

        def versionHeader = new File(repositoryRoot, "cmake/version.hpp.in").text
                .replace("@PROJECT_NAMESPACE@", "ascend_forge")
                .replace("@PROJECT_VERSION_MAJOR@", components[0])
                .replace("@PROJECT_VERSION_MINOR@", components[1])
                .replace("@PROJECT_VERSION_PATCH@", components[2])
        def output = new File(prefabHeaders, "ascend_forge/version.hpp")
        output.parentFile.mkdirs()
        output.text = versionHeader
    }
}

tasks.named("preBuild").configure {
    dependsOn("preparePrefabHeaders")
}

// CMake records the fetched SDL include tree while it configures. Copy those
// public headers into the prefab snapshot after that configure, so arena.h
// can include SDL3 from the packaged AAR.
afterEvaluate {
    android.libraryVariants.all { variant ->
        def variantName = variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
        def stageProvider = tasks.register("stageSdlPrefabHeaders${variantName}") {
            dependsOn("preparePrefabHeaders", "externalNativeBuild${variantName}")
            doLast {
                def markers = fileTree(dir: moduleBuildDir, include: "sdl-public-include-*.txt").files
                def marker = markers.find { it.isFile() && it.length() > 0 }
                if (marker == null) {
                    throw new GradleException(
                            "CMake did not record the SDL public include directory")
                }
                def includeRoot = marker.text.trim()
                def sdlHeaders = new File(includeRoot, "SDL3")
                if (!sdlHeaders.isDirectory()) {
                    throw new GradleException("SDL public headers not found at ${sdlHeaders}")
                }
                copy {
                    from sdlHeaders
                    into new File(prefabHeaders, "SDL3")
                    include "**/*.h"
                }
            }
        }
        tasks.configureEach { task ->
            if (task.name == "prefab${variantName}Package") {
                task.dependsOn(stageProvider)
            }
        }
    }
}
